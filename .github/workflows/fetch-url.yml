name: Fetch URL and Store to Repo

# ۱. اجرای دستی از UI
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس URL که باید فراخوانی شود'
        required: true
        type: string

jobs:
  fetch_and_commit:
    runs-on: ubuntu-latest

    # ⚠️ فعال‌کردن Node 24 برای تمام job‑ها
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # برای push لازم است تمام تاریخچه‌ را داشته باشیم
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch content
        run: |
          curl -L "${{ github.event.inputs.url }}" -o fetched.html

      - name: Commit and push
        run: |
          git config --global user.email "github-action@example.com"
          git config --global user.name  "GitHub Action"
          git add fetched.html
          git commit -m "Fetched content from ${{ github.event.inputs.url }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
