name: Fetch URL Content

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to fetch with curl"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch URL content with curl
        run: |
          # اگر Input تنظیم نشده باشد، از ادامه جلوگیری کن
          URL="${{ github.event.inputs.url }}"
          if [ -z "$URL" ]; then
            echo "⚠️ No URL provided in workflow inputs."
            exit 1
          fi

          echo "Fetching: $URL"

          # دستور curl بدون بلاک { } و با پارامترهای صحیح
          curl -L --max-time 30 -A "Mozilla/5.0" "$URL" > fetched-content.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fetched-content.html
          git commit -m "Update fetched content from workflow" || echo "No changes to commit"
          git push
