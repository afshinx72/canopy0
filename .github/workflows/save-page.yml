name: Save Web Page Offline

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the page to save offline"
        required: true
        type: string

permissions:
  contents: write

jobs:
  save-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate URL
        run: |
          URL="${{ github.event.inputs.url }}"
          if ! [[ "$URL" =~ ^https?:// ]]; then
            echo "Only http:// or https:// URLs are allowed."
            exit 1
          fi

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget chromium-browser

      - name: Clean output folders
        run: |
          rm -rf saved-page screenshot.png index.html
          mkdir -p saved-page

      - name: Download page for offline use
        run: |
          URL="${{ github.event.inputs.url }}"
          cd saved-page
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --span-hosts \
            --no-parent \
            --directory-prefix=. \
            --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            "$URL"

      - name: Take screenshot
        run: |
          URL="${{ github.event.inputs.url }}"
          chromium-browser \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --window-size=1440,3000 \
            --screenshot=screenshot.png \
            "$URL"

      - name: Create viewer page
        run: |
          FIRST_HTML=$(find saved-page -type f -name "*.html" | head -n 1)

          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Saved Web Page</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
              img { max-width: 100%; border: 1px solid #ccc; margin-bottom: 20px; }
              a { display: inline-block; margin: 10px 0; }
            </style>
          </head>
          <body>
            <h1>Saved Web Page</h1>
            <p><strong>Source URL:</strong> ${{ github.event.inputs.url }}</p>

            <h2>Screenshot</h2>
            <img src="screenshot.png" alt="Page Screenshot">

            <h2>Offline Version</h2>
            <p><a href="$FIRST_HTML" target="_blank">Open offline saved page</a></p>
          </body>
          </html>
          EOF

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saved-page screenshot.png index.html
          git commit -m "Save offline page and screenshot" || echo "No changes to commit"
          git push
