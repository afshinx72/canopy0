name: Display Webpage Content

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the webpage to fetch'
        required: true

jobs:
  display_content:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Webpage Content
        id: fetch_content
        shell: bash
        run: |
          URL="${{ github.event.inputs.url }}"
          curl -s "$URL" > webpage.txt

      - name: Display Webpage Content
        run: cat webpage.txt
