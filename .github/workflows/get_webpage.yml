name: Display Webpage Content

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the webpage to fetch'
        required: true

jobs:
  display_content:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Webpage Content
        id: fetch_content
        shell: bash
        run: |
          URL="${{ github.event.inputs.url }}"
          curl -s "$URL" > webpage.txt

      - name: Upload webpage.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webpage
          path: webpage.txt

      - name: Download webpage artifact
        uses: actions/download-artifact@v4
        with:
          name: webpage
          path: /tmp/webpage

      - name: Display Webpage Content
        run: cat /tmp/webpage/webpage.txt
